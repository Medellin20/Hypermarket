[build]
  base = "App"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Transforme la sortie Next.js en pages, fichiers statiques et fonctions Netlify.
# Ne pas publier .next comme un simple dossier de fichiers statiques.
[[plugins]]
  package = "@netlify/plugin-nextjs"
